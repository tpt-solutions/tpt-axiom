# cargo-deny configuration: licenses, advisories, bans, sources.
# Run with `cargo deny check` (CI does).

[licenses]
# The workspace is dual MIT OR Apache-2.0; the dependency tree adds these
# permissive licenses only.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
yanked = "deny"
ignore = [
    # tracing-subscriber 0.2.25 is pulled in by ark-relations 0.5.x (the
    # arkworks 0.5 line used by the backend). The ANSI-escape log injection
    # only matters when untrusted input is logged through a fmt subscriber;
    # this workspace installs no tracing subscriber. Remove once the backend
    # moves to arkworks 0.6 (which drops the old tracing-subscriber).
    "RUSTSEC-2025-0055",
    # paste 1.0.15 is unmaintained (no safe upgrade) and is pulled in by
    # ark-ff 0.5.x. It is a proc-macro used at compile time only; no runtime
    # exposure. Remove once the backend moves to arkworks 0.6.
    "RUSTSEC-2024-0436",
    # derivative 2.2.0 is unmaintained (no safe upgrade) and is pulled in by
    # ark-crypto-primitives 0.5.x. It is a proc-macro used at compile time
    # only; no runtime exposure. Remove once the backend moves to arkworks 0.6.
    "RUSTSEC-2024-0388",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
