name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # Weekly sweep: catches breaking dependency updates and rot in
  # rarely-touched jobs (deny advisories, MSRV) even without activity.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets --all-features
      - run: cargo test --workspace --doc
      # The no_std claim: the core builds against libm without std.
      - run: cargo build -p tpt-axiom-core --no-default-features --features libm
      # Cross-compile the foundation for embedded (thumbv7em, no std).
      - run: rustup target add thumbv7em-none-eabihf
      - run: cargo build -p tpt-axiom-core --no-default-features --features libm --target thumbv7em-none-eabihf
      # WebAssembly foundation build.
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo build -p tpt-axiom-core --target wasm32-unknown-unknown
      # Every example must keep running (the halo2 comparison exercises
      # both real backends end to end).
      - run: cargo run -p tpt-axiom-examples --example kalman_filter
      - run: cargo run -p tpt-axiom-examples --example monte_carlo
      - run: cargo run -p tpt-axiom-examples --example sensor_fusion
      - run: cargo run -p tpt-axiom-examples --example ml_decision_abstention
      - run: cargo run -p tpt-axiom-examples --example ab_test
      - run: cargo run -p tpt-axiom-examples --example custom_backend
      - run: cargo run -p tpt-axiom-examples --example age_proof
      - run: cargo run -p tpt-axiom-examples --example sensor_fusion_claim
      - run: cargo run -p tpt-axiom-examples --example credit_score_gate
      - run: cargo run -p tpt-axiom-examples --example proof_service
      - run: cargo run -p tpt-axiom-examples --example backend_comparison
      # The two-process proof-file pair, in order.
      - run: cargo run -p tpt-axiom-examples --example balance_transfer_prove -- target/ci-proof
      - run: cargo run -p tpt-axiom-examples --example balance_transfer_verify -- target/ci-proof

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The declared MSRV must hold for the publishable foundation crate
      # (dev-dependencies are exempt from MSRV and need a newer rustc, so
      # only library targets are checked here).
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p tpt-axiom-core
      - run: cargo check -p tpt-axiom-core --features serde
      - run: cargo check -p tpt-axiom-core --no-default-features --features libm
      - run: cargo check -p tpt-axiom-ir
      - run: cargo check -p tpt-axiom-zk

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --workspace --all-features

  deny:
    name: deny (licenses + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check licenses advisories bans

  publish-dry-run:
    name: publish dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The release order matters (dependencies first); --allow-dirty is not
      # needed on CI because the tree is clean there.
      - run: |
          for crate in tpt-axiom-ir tpt-axiom-core tpt-axiom-zk tpt-axiom-macros tpt-axiom-verify tpt-axiom-backend-halo2 tpt-axiom-backend-arkworks tpt-axiom-interop tpt-axiom-cli tpt-axiom; do
            cargo publish --dry-run -p "$crate" || exit 1
          done

  bench:
    name: benches compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --no-run --workspace

  semver:
    name: semver-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          # Pre-1.0: breaking changes are allowed within 0.x, but the check
          # still catches accidental removals that should bump a version.
          release-type: minor

  feature-powerset:
    name: feature powerset (foundation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      # The foundation's feature matrix is small and every combination must
      # compile (std vs libm, serde on/off, and their crossings).
      - run: cargo hack check -p tpt-axiom-core --feature-powerset --no-dev-deps

  book:
    name: docs book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jontyy/mdbook-actions@master
        with:
          mdbook-version: latest
      - run: mdbook build docs/book

  onchain:
    name: on-chain verifier (foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: foundry-rs/foundry-toolchain@v1
      # Regenerate the verifier + proof from a fresh arkworks run, then
      # verify on anvil through the EIP-2537 precompiles.
      - run: cargo run -p tpt-axiom-examples --example onchain_export
      - run: cd contracts && forge test -vv

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Informational for now (no coverage gate yet); the report makes
      # untested paths visible in the job log.
      - run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
