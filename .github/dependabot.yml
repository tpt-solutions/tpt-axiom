version: 2
updates:
  # Workspace Cargo dependencies: grouped so a compatible batch lands as one
  # PR instead of a flood.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The tag of dtolnay/rust-toolchain IS the Rust version to install;
      # bumping it picks a nonexistent toolchain. Keep in sync with
      # rust-toolchain.toml manually.
      - dependency-name: "dtolnay/rust-toolchain"
