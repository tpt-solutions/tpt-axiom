# tpt-axiom — Probabilistic Logic and Native Zero-Knowledge State for Rust.
#
# Dual-licensed MIT OR Apache-2.0.  Copyright TPT Solutions.
#
# Workspace layout:
#   crates/tpt-axiom-core         — Fuzzy<T> / Distribution<T> probabilistic types
#   crates/tpt-axiom-ir           — shared arithmetic intermediate representation
#   crates/tpt-axiom-macros       — #[zk_provable] proc-macro
#   crates/tpt-axiom-zk           — ZkBackend trait + circuit/proving-key/verifying-key abstractions
#   crates/tpt-axiom-backend-*    — backend adapters (Phase 4)
#   crates/tpt-axiom-cli          — build-time driver (keygen / verify)
#   crates/tpt-axiom              — umbrella crate re-exporting the public prelude

[workspace]
resolver = "2"
members = [
    "crates/tpt-axiom-core",
    "crates/tpt-axiom-ir",
    "crates/tpt-axiom-macros",
    "crates/tpt-axiom-zk",
    "crates/tpt-axiom-backend-halo2",
    "crates/tpt-axiom-backend-arkworks",
    "crates/tpt-axiom-backend-sp1",
    "crates/tpt-axiom-cli",
    "crates/tpt-axiom",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/tpt-axiom"
homepage = "https://github.com/tpt-solutions/tpt-axiom"
documentation = "https://docs.rs/tpt-axiom"
keywords = ["probability", "statistics", "zero-knowledge", "zk", "rust"]
categories = ["mathematics", "cryptography", "science", "compiler-plugins"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[workspace.dependencies]
tpt-axiom-core = { version = "0.1.0", path = "crates/tpt-axiom-core" }
tpt-axiom-ir = { version = "0.1.0", path = "crates/tpt-axiom-ir" }
tpt-axiom-macros = { version = "0.1.0", path = "crates/tpt-axiom-macros" }
tpt-axiom-zk = { version = "0.1.0", path = "crates/tpt-axiom-zk" }
tpt-axiom-backend-halo2 = { version = "0.1.0", path = "crates/tpt-axiom-backend-halo2" }
tpt-axiom-backend-arkworks = { version = "0.1.0", path = "crates/tpt-axiom-backend-arkworks" }
tpt-axiom-backend-sp1 = { version = "0.1.0", path = "crates/tpt-axiom-backend-sp1" }

num-traits = "0.2"
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
quote = "1"
proc-macro2 = "1"

[profile.release]
lto = "thin"

[profile.bench]
lto = "thin"
debug = true
