[package]
name = "tpt-axiom-backend-halo2"
description = "halo2 (IPA/Vesta) ZkBackend adapter for tpt-axiom"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["zero-knowledge", "halo2", "zkp", "backend", "plonk"]
categories = ["cryptography", "mathematics"]

[lints]
workspace = true

[dependencies]
tpt-axiom-ir = { workspace = true }
tpt-axiom-zk = { workspace = true }
halo2_proofs = { workspace = true }
pasta_curves = { workspace = true }
ff = { workspace = true }
group = { workspace = true }
rand = { workspace = true, features = ["std", "getrandom"] }

[dev-dependencies]
serde_json = "1"
tpt-axiom-macros = { workspace = true }
tpt-axiom-zk = { workspace = true, features = ["conformance", "serde"] }
tpt-axiom-backend-arkworks = { workspace = true }
halo2_proofs = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "backend"
harness = false
