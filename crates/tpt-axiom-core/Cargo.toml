[package]
name = "tpt-axiom-core"
description = "Probabilistic and uncertainty types (Fuzzy<T>, Distribution<T>) for tpt-axiom"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["probability", "uncertainty", "statistics", "error-propagation", "fuzzy"]
categories = ["mathematics", "science", "no-std"]

[lints]
workspace = true

[features]
default = []
# Serialisable probabilistic values and decisions (opt-in: keeps the core
# dependency-free without it).
serde = ["dep:serde"]

[dependencies]
num-traits = { version = "0.2", default-features = false, features = ["std"] }
serde = { version = "1", default-features = false, features = ["alloc", "derive"], optional = true }
