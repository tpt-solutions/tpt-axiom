[package]
name = "tpt-axiom-core"
description = "Probabilistic and uncertainty types (Fuzzy<T>, Distribution<T>) for tpt-axiom"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["probability", "uncertainty", "statistics", "error-propagation", "fuzzy"]
categories = ["mathematics", "science", "no-std"]

[lints]
workspace = true

[features]
# Float math comes from std by default; `--no-default-features --features
# libm` builds the crate as true no_std (soft-float portable).
default = ["std"]
std = ["num-traits/std"]
libm = ["num-traits/libm"]
# Serialisable probabilistic values and decisions (opt-in: keeps the core
# dependency-free without it).
serde = ["dep:serde"]

[dependencies]
num-traits = { version = "0.2", default-features = false }
serde = { version = "1", default-features = false, features = ["alloc", "derive"], optional = true }

[dev-dependencies]
proptest = "1"
serde_json = "1"
