[package]
name = "tpt-axiom-cli"
description = "Build-time driver for tpt-axiom (key generation, verification invocation)"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["zero-knowledge", "cli", "keygen", "prover", "zkp"]
categories = ["command-line-utilities", "cryptography"]

[lints]
workspace = true

# Named `cargo-axiom` so it is invocable as `cargo axiom` once on PATH
# (cargo subcommand convention).
[[bin]]
name = "cargo-axiom"
path = "src/main.rs"

[dependencies]
tpt-axiom-zk = { workspace = true }
tpt-axiom-ir = { workspace = true }
