[package]
name = "tpt-axiom-zk"
description = "Backend-agnostic zero-knowledge abstractions (CircuitDefinition, ZkBackend) for tpt-axiom"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["zero-knowledge", "zkp", "circuit", "prover", "verifier"]
categories = ["cryptography", "mathematics", "no-std"]

[lints]
workspace = true

[features]
default = []
# Exposes `tpt_axiom_zk::conformance`: generic prove/verify drivers shared by
# every backend adapter's test suite.
conformance = []

[dependencies]
sha2 = { workspace = true }
tpt-axiom-ir = { workspace = true }

# docs.rs builds with every feature so all doc examples render.
[package.metadata.docs.rs]
all-features = true
